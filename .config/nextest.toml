[profile.default]
retries = 0
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 3 }

[test-groups.roslyn]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(koh-compile) & (binary(assembly) | binary(opcodes) | binary(references) | binary(lowering) | binary(sm83))'
test-group = 'roslyn'
