[workspace]
members = ["rust/koh-asm", "rust/koh-objects", "rust/koh-link", "rust/koh-compile", "rust/koh-ui", "rust/koh-emulator", "rust/koh-debugger", "rust/koh-engine", "rust/koh-test-host", "rust/koh-lsp"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
rstest = { version = "0.28", default-features = false }

[profile.release]
lto = true
strip = true
