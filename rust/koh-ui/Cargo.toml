[package]
name = "koh-ui"
version = "1.0.2"
edition.workspace = true
rust-version = "1.92"
license.workspace = true

[dependencies]
gpui-kit = "=0.10.0"
image = { version = "0.25", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "koh-emulator"
path = "src/main.rs"
