[package]
name = "koh-engine"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
koh-emulator = { path = "../koh-emulator" }
koh-debugger = { path = "../koh-debugger" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
libloading = "0.8.9"

[dev-dependencies]
koh-asm = { path = "../koh-asm" }
koh-link = { path = "../koh-link" }

[[bin]]
name = "koh-engine"
path = "src/main.rs"
