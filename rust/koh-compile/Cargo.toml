[package]
name = "koh-compile"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
koh-objects = { path = "../koh-objects" }
clrmeta = "=0.1.0"
sha2 = { version = "=0.10.9", default-features = false }
object = { version = "=0.40.0", default-features = false, features = ["std", "read", "pe"] }
png = "=0.18.1"
unicode-properties = { version = "=0.1.5", default-features = false, features = ["general-category"] }

[dev-dependencies]
koh-link = { path = "../koh-link" }
rstest.workspace = true
tempfile = "3"
serde_json = "1"
