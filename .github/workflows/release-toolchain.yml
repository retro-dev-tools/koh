name: Release Toolchain
on:
  push:
    tags: ['tools-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package-only version (no release is created)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-toolchain-${{ github.event_name }}-${{ github.ref }}
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('tools-v{0}', inputs.version) || github.ref_name }}
  CARGO_BUILD_JOBS: '4'
  DOTNET_PROCESSOR_COUNT: '4'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just@1.59.0
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev
      - run: just package "$RELEASE_TAG"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ runner.os }}
          path: |
            artifacts/package/koh-*
            artifacts/package/SHA256SUMS-*
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolchain-*
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and create draft
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat SHA256SUMS-* > SHA256SUMS.txt
          rm SHA256SUMS-*
          sha256sum --check SHA256SUMS.txt
          flags=(--draft --verify-tag --generate-notes)
          version="${RELEASE_TAG#tools-v}"
          if [[ "$version" == 0.* || "${version%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" ./*
