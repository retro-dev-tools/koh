name: Release Toolchain
on:
  push:
    tags: ['tools-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package-only version (no release is created)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-toolchain-${{ github.event_name }}-${{ github.ref }}
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('tools-v{0}', inputs.version) || github.ref_name }}
  CARGO_BUILD_JOBS: '4'
  DOTNET_PROCESSOR_COUNT: '4'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just@1.59.0
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev
      - run: just package "$RELEASE_TAG"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchain-${{ runner.os }}
          path: |
            artifacts/package/koh-*
            artifacts/package/SHA256SUMS-*
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: toolchain-*
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and create draft
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat SHA256SUMS-* > SHA256SUMS.txt
          rm SHA256SUMS-*
          sha256sum --check SHA256SUMS.txt
          flags=(--draft --verify-tag --generate-notes)
          version="${RELEASE_TAG#tools-v}"
          if [[ "$version" == 0.* || "${version%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" ./*
