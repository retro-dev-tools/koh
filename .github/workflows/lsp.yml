name: Native LSP

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/lsp.yml'
      - 'rust/koh-lsp/**'
      - 'rust/koh-asm/**'
      - 'rust/koh-objects/**'
      - 'rust/koh-link/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'global.json'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'build.proj'
      - 'scripts/stage-rust-notices.py'
      - 'src/Asm/Koh.Native/**'
      - 'editors/vscode/**'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-lsp-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_BUILD_JOBS: '4'
  DOTNET_PROCESSOR_COUNT: '4'

jobs:
  lsp:
    name: native-lsp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        id: rust
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: ${{ runner.os }}-lsp-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'global.json', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-lsp-${{ steps.rust.outputs.cachekey }}-
      - name: Install editor test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6
      - name: Test native language server
        run: |
          cargo build -p koh-asm --locked
          cargo test -p koh-lsp --locked
      - name: Publish and test native package
        shell: bash
        run: |
          dotnet msbuild build.proj -t:PublishLanguageServer
          rid=$(dotnet msbuild build.proj -nologo -getProperty:LanguageServerRuntimeIdentifier)
          package="$PWD/artifacts/language-server/$rid"
          suffix=
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            package="$(cygpath -m "$package")"
            suffix=.exe
          fi
          "$package/koh-link$suffix" --version
          KOH_LSP_TEST_BINARY="$package/koh-lsp$suffix" cargo test -p koh-lsp --test stdio --locked
          echo "KOH_TEST_LSP_DIR=$package" >> "$GITHUB_ENV"
      - name: Verify packaged dependency notices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ["KOH_TEST_LSP_DIR"]) / "licenses/rust-lsp"
          for package in json.loads((root / "manifest.json").read_text())["packages"]:
              assert hashlib.sha256((root / package["notice_file"]).read_bytes()).hexdigest() == package["notice_sha256"], package["name"]
          print("Exact YAML dependency notice hashes verified")
          PY
      - name: Test actual VS Code client
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm test
          else
            npm test
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-lsp-${{ runner.os }}
          path: artifacts/language-server/
          if-no-files-found: ignore
          retention-days: 7
