name: Release Extension

on:
  push:
    tags:
      - 'ext-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package-only dry run version (must match package.json)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-extension-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('ext-v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate release version
        run: python scripts/release-preflight.py "$RELEASE_TAG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install deps
        working-directory: editors/vscode
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Compile TypeScript
        working-directory: editors/vscode
        run: npm run compile

      - name: Package VSIX (platform-agnostic)
        working-directory: editors/vscode
        # The VSIX carries only TS + node_modules; all native binaries
        # are fetched by the extension from the toolchain release at
        # runtime, so we ship a single platform-neutral package.
        run: npm run package

      - name: Generate checksums
        working-directory: editors/vscode
        run: sha256sum -- *.vsix > SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: |
            editors/vscode/*.vsix
            editors/vscode/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: artifacts
          merge-multiple: true

      - name: Detect prerelease
        id: pre
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          version="${tag#ext-v}"
          if [[ "$version" =~ ^0\. ]] || [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Drafts-by-default: see release-toolchain.yml for the
        # rationale. Publish with `scripts/publish-release.sh <tag>`
        # after verifying the VSIX installs and activates cleanly.
        run: |
          tag="$RELEASE_TAG"
          version="${tag#ext-v}"
          flags=(--repo "${{ github.repository }}" --draft --generate-notes --verify-tag --title "Extension $version")
          if [[ "${{ steps.pre.outputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f | sort)
          ls -lh "${assets[@]}"
          gh release create "$tag" "${flags[@]}" "${assets[@]}"
