name: Release Extension
on:
  push:
    tags: ['ext-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package-only version (no release is created)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-extension-${{ github.event_name }}-${{ github.ref }}
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('ext-v{0}', inputs.version) || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just@1.59.0
      - run: just extension "$RELEASE_TAG"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: artifacts/extension/
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and create draft
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          flags=(--draft --verify-tag --generate-notes)
          version="${RELEASE_TAG#ext-v}"
          if [[ "$version" == 0.* || "${version%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" ./*
