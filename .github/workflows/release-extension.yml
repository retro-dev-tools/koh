name: Release Extension
on:
  push:
    tags: ['ext-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package-only version (no release is created)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-extension-${{ github.event_name }}-${{ github.ref }}
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('ext-v{0}', inputs.version) || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just@1.59.0
      - run: just extension "$RELEASE_TAG"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: artifacts/extension/
          if-no-files-found: error
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and create draft
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          flags=(--draft --verify-tag --generate-notes)
          version="${RELEASE_TAG#ext-v}"
          if [[ "$version" == 0.* || "${version%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" ./*
