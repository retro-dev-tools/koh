name: Full validation

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  native:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +stable fmt --all -- --check
      - name: Check
        run: cargo +stable check --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo +stable nextest run --workspace --all-features --locked
      - name: Test Rust documentation
        run: cargo +stable test --doc --workspace --all-features --locked
      - name: Build native executables
        run: cargo +stable build --release --package koh-asm --package koh-link --package koh-compile --locked
      - name: Smoke-test native compiler artifacts
        env:
          KOH_COMPILE: ${{ github.workspace }}/target/release/koh-compile${{ runner.os == 'Windows' && '.exe' || '' }}
          KOH_LINK: ${{ github.workspace }}/target/release/koh-link${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo +stable nextest run -p koh-compile --test sdk --locked -E 'test(sdk_dotnet_run)'
      - name: Publish native-backed language server
        run: dotnet publish src/Asm/Koh.Lsp -c Release --no-self-contained -o artifacts/language-server -m:1
      - uses: actions/upload-artifact@v4
        with:
          name: koh-lsp-native-${{ runner.os }}
          path: artifacts/language-server/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: koh-native-${{ runner.os }}
          path: |
            target/release/koh-asm
            target/release/koh-asm.exe
            target/release/koh-link
            target/release/koh-link.exe
            target/release/koh-compile
            target/release/koh-compile.exe
            licenses/rust-assembler-dependencies.md
            licenses/rust-assembler/

  references:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install RGBDS build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison flex libpng-dev pkg-config
      - name: Build pinned RGBDS
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          echo "$RUNNER_TEMP/rgbds" >> "$GITHUB_PATH"
      - name: Test against RGBDS
        env:
          KOH_RGBDS_TEST: '1'
        run: cargo +stable nextest run -p koh-asm -p koh-link --all-features --locked
      - name: Compare ELF and independent RGBDS pipelines
        run: python3 scripts/verify-rust-assembler.py --output "$RUNNER_TEMP/rust-assembler-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-assembler-verification
          path: ${{ runner.temp }}/rust-assembler-verification
          if-no-files-found: ignore

  sdl3-renderer:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb weston libdecor-0-0 adwaita-icon-theme mesa-vulkan-drivers
      - name: Run SDL software framebuffer regressions
        run: dotnet run --project tests/UI/KohUI.Sdl3.Tests -c Release
      - name: Run SDL dummy window regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          KOH_SDL_WINDOW_TEST: '1'
        run: dotnet run --project tests/UI/KohUI.Sdl3.Tests -c Release --no-build
      - name: Run SDL X11 window regressions
        env:
          SDL_VIDEODRIVER: x11
          SDL_RENDER_DRIVER: software
          KOH_SDL_WINDOW_TEST: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' dotnet run --project tests/UI/KohUI.Sdl3.Tests -c Release --no-build
      - name: Run SDL Wayland window regressions
        env:
          SDL_VIDEODRIVER: wayland
          SDL_RENDER_DRIVER: vulkan
          KOH_SDL_WINDOW_TEST: '1'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=koh-sdl-tests
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' bash <<'SH'
          set -eu
          weston --backend=x11-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --width=640 --height=512 --scale=2 --idle-time=0 > "$XDG_RUNTIME_DIR/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid"; cat "$XDG_RUNTIME_DIR/weston.log"' EXIT
          for attempt in $(seq 1 100); do
            test ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          for renderer in vulkan software; do
            DISPLAY= SDL_RENDER_DRIVER="$renderer" timeout 60s dotnet run --project tests/UI/KohUI.Sdl3.Tests -c Release --no-build
          done
          SH

  build-and-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        # Koh.Ci.slnf: everything CI builds, including the Koh.Sdk sample games and
        # verify apps; excludes the Playwright E2E suite.
        run: dotnet restore Koh.Ci.slnf

      - name: Build solution
        run: dotnet build Koh.Ci.slnf --no-restore --configuration Release

      - name: Run tests
        # The full suite, including Koh.Compiler.Tests. Local development uses
        # `build.proj -t:Test` (Koh.Fast.slnf), which drops that project because its
        # Roslyn-plus-emulator cases exhaust memory on a desktop.
        run: dotnet test --solution Koh.Ci.slnf --no-build --configuration Release

  # NativeAOT publishes of the emulator on each host runner. The AOT
  # compiler can't cross-OS, so each target's binary is produced on
  # its native runner. This job catches RID-specific build breakage
  # (missing native assets, platform API gaps) before it reaches a
  # user trying to ship.
  emulator-aot-publish:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Koh.Emulator.App (NativeAOT)
        run: dotnet msbuild build.proj -t:PublishEmulatorApp

      - name: Publish KohUI demo (NativeAOT)
        run: dotnet publish samples/ui/KohUI.Demo -c Release -r ${{ matrix.rid }}

      - name: Smoke-test headless NativeAOT emulator
        shell: bash
        run: |
          dotnet msbuild build.proj -t:BuildSample2048
          pub=src/Emulator/Koh.Emulator.App/bin/Release/net10.0/${{ matrix.rid }}/publish
          exe="$pub/Koh.Emulator.App"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          smoke_dir="$(mktemp -d)"
          "$exe" samples/asm/gb-2048/build/2048.gbc --frames=300 --screenshot="$smoke_dir/frame.png"
          python - "$smoke_dir/frame.png" <<'PY'
          import struct
          import sys
          import zlib
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack_from(">II", data, 16) == (160, 144)
          offset = 8
          compressed = bytearray()
          while offset < len(data):
              size = struct.unpack_from(">I", data, offset)[0]
              kind = data[offset + 4:offset + 8]
              chunk = data[offset + 8:offset + 8 + size]
              assert zlib.crc32(kind + chunk) == struct.unpack_from(">I", data, offset + 8 + size)[0]
              if kind == b"IDAT":
                  compressed.extend(chunk)
              offset += size + 12
          assert len(zlib.decompress(compressed)) == 144 * (1 + 160 * 4)
          print("Headless NativeAOT capture: 160x144 PNG")
          PY

      - name: Report publish size
        shell: bash
        run: |
          pub=src/Emulator/Koh.Emulator.App/bin/Release/net10.0/${{ matrix.rid }}/publish
          echo "── publish contents ──"
          ls -lh "$pub"
          echo "── total ──"
          du -sh "$pub"

  # VS Code extension tests run under a headless VS Code instance via
  # @vscode/test-cli. Linux needs xvfb-run because VS Code's test host
  # always opens a window even in "headless" mode; Windows and macOS
  # runners have a session that VS Code is happy to render into.
  extension-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install deps
        working-directory: editors/vscode
        run: npm ci

      - name: Run tests (xvfb on Linux)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: xvfb-run -a npm test

      - name: Run tests
        if: runner.os != 'Linux'
        working-directory: editors/vscode
        run: npm test

  benchmark-native:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build benchmarks
        run: dotnet build tools/benchmarks/Koh.Benchmarks/Koh.Benchmarks.csproj --configuration Release

      - name: Verify benchmarks discover
        # Benchmark discovery
        run: |
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Phase2*'
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Phase3*'
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Native*'

  build-sample-2048:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build sample
        run: dotnet msbuild build.proj -t:BuildSample2048
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: 2048.gbc
          path: samples/asm/gb-2048/build/2048.gbc
