name: CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: stable
  DOTNET_PROCESSOR_COUNT: '4'
  CARGO_BUILD_JOBS: '4'
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: ${{ runner.os }}-native-${{ hashFiles('Cargo.lock', 'global.json', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-native-
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev xvfb libxtst6 mesa-vulkan-drivers fonts-dejavu-core bison flex libpng-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +stable fmt --all -- --check
      - name: Check native engine lints
        run: cargo clippy -p koh-emulator -p koh-debugger -p koh-engine -p koh-test-host --all-targets --no-deps --locked -- -D warnings
      - name: Check Rust targets
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test Rust workspace
        run: cargo +stable nextest run --workspace --all-features --locked --no-fail-fast
      - name: Test Rust documentation
        run: cargo +stable test --doc --workspace --all-features --locked
      - name: Build and test managed projects
        shell: bash
        run: |
          dotnet build Koh.Ci.slnf -c Release -m:1
          dotnet test --solution Koh.Ci.slnf -c Release --no-build --max-parallel-test-modules 1
      - name: Build native executables
        run: cargo +stable build --release --package koh-asm --package koh-link --package koh-compile --package koh-engine --locked
      - name: Stage Rust runtime notices
        run: python scripts/stage-rust-notices.py artifacts/rust-runtime
      - name: Smoke-test native compiler artifacts
        env:
          KOH_COMPILE: ${{ github.workspace }}/target/release/koh-compile${{ runner.os == 'Windows' && '.exe' || '' }}
          KOH_LINK: ${{ github.workspace }}/target/release/koh-link${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo +stable nextest run -p koh-compile --test sdk --locked -E 'test(sdk_dotnet_run)'
      - name: Publish native-backed language server
        run: dotnet publish src/Asm/Koh.Lsp -c Release --no-self-contained -o artifacts/language-server -m:1
      - name: Publish desktop and native engine
        run: |
          dotnet msbuild build.proj -t:PublishEmulatorApp
          rid=$(dotnet msbuild build.proj -nologo -getProperty:EmulatorRuntimeIdentifier)
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          ls -lh "artifacts/emulator/$rid"
        id: desktop
        shell: bash
      - name: Test native audio resets
        shell: bash
        run: |
          pub="$PWD/artifacts/emulator/${{ steps.desktop.outputs.rid }}"
          export PATH="$pub:$PATH"
          export LD_LIBRARY_PATH="$pub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$pub${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          ALSOFT_DRIVERS=null cargo test -p koh-engine --bin koh-engine openal_null_backend_warmup_reset_and_restart --locked -- --ignored
          ALSOFT_DRIVERS=null cargo test -p koh-engine --test session audio_resume_reset_and_restore_remain_operational --locked -- --ignored
      - name: Smoke-test headless native engine
        shell: bash
        run: |
          dotnet msbuild build.proj -t:BuildSample2048
          pub=artifacts/emulator/${{ steps.desktop.outputs.rid }}
          exe="$pub/koh-engine"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          smoke_dir="$(mktemp -d)"
          "$exe" samples/asm/gb-2048/build/2048.gbc --frames=300 --screenshot="$smoke_dir/frame.png"
          python - "$smoke_dir/frame.png" <<'PY'
          import struct
          import sys
          import zlib
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack_from(">II", data, 16) == (160, 144)
          offset = 8
          compressed = bytearray()
          while offset < len(data):
              size = struct.unpack_from(">I", data, offset)[0]
              kind = data[offset + 4:offset + 8]
              chunk = data[offset + 8:offset + 8 + size]
              assert zlib.crc32(kind + chunk) == struct.unpack_from(">I", data, offset + 8 + size)[0]
              if kind == b"IDAT":
                  compressed.extend(chunk)
              offset += size + 12
          assert len(zlib.decompress(compressed)) == 144 * (1 + 160 * 4)
          print("Headless native capture: 160x144 PNG")
          PY
      - name: Install image test dependency
        run: python -m pip install Pillow==13.0.0
      - name: Verify packaged GPUI window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/test-verify-gpui.py
          dotnet build samples/csharp/gb-2048-v2/Gb2048V2.csproj -c Release -m:1
          python scripts/verify-gpui.py artifacts/emulator/${{ steps.desktop.outputs.rid }}/koh-emulator samples/csharp/gb-2048-v2/2048v2.gb --output "$RUNNER_TEMP/gpui-native"
      - name: Verify native Windows/macOS window
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python scripts/test-verify-gpui-platform.py
          dotnet build samples/csharp/gb-2048-v2/Gb2048V2.csproj -c Release -m:1
          exe=artifacts/emulator/${{ steps.desktop.outputs.rid }}/koh-emulator
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          python scripts/verify-gpui-platform.py "$exe" samples/csharp/gb-2048-v2/2048v2.gb --output "$RUNNER_TEMP/gpui-native"
      - name: Test VS Code and real native debugging
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/native-dap-fixture"
          cargo run -p koh-debugger --example fixture --locked -- "$fixture"
          desktop="$PWD/artifacts/emulator/${{ steps.desktop.outputs.rid }}/koh-emulator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            desktop="$(cygpath -m "$desktop.exe")"
            fixture="$(cygpath -m "$fixture")"
          fi
          export KOH_TEST_DESKTOP="$desktop"
          export KOH_TEST_DAP_ROM="$fixture/fixture.gb"
          export KOH_TEST_DAP_ELF="$fixture/fixture.elf"
          export ALSOFT_DRIVERS=null
          cd editors/vscode
          npm ci
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm test
          else
            npm test
          fi
      - name: Compare pinned RGBDS and ELF pipelines
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds" -j2
          export PATH="$RUNNER_TEMP/rgbds:$PATH"
          KOH_RGBDS_TEST=1 cargo nextest run -p koh-asm -p koh-link --all-features --locked
          python scripts/verify-rust-assembler.py --output "$RUNNER_TEMP/rust-assembler-verification"
      - name: Verify benchmarks discover
        run: |
          dotnet build tools/benchmarks/Koh.Benchmarks/Koh.Benchmarks.csproj -c Release -m:1
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Phase2*'
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Phase3*'
          dotnet run --project tools/benchmarks/Koh.Benchmarks --configuration Release --no-build -- --list flat --filter '*Native*'
        if: runner.os == 'Linux'
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            artifacts/
            target/release/koh-asm*
            target/release/koh-link*
            target/release/koh-compile*
            target/release/koh-engine*
            licenses/rust-assembler/
            licenses/rust-assembler-dependencies.md
            samples/asm/gb-2048/build/2048.gbc
            ${{ runner.temp }}/gpui-native/
            ${{ runner.temp }}/rust-assembler-verification/
          if-no-files-found: ignore
          retention-days: 7
