name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.config/**'
      - 'Cargo.*'
      - 'Directory.*'
      - 'Koh.*'
      - 'global.json'
      - 'build.proj'
      - 'rust/**'
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - 'tools/**'
      - 'editors/vscode/**'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  native:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: ${{ runner.os }}-pr-rust-${{ hashFiles('Cargo.lock', 'global.json', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-pr-rust-
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Rust fast tests
        run: cargo +stable nextest run --workspace --all-features --locked --no-fail-fast -E 'not (package(koh-compile) & (binary(driver) | binary(cubes) | binary(sdk)))'
      - name: Test Rust documentation
        run: cargo +stable test --doc --workspace --all-features --locked

  managed:
    name: .NET fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
          key: ${{ runner.os }}-pr-managed-${{ hashFiles('Cargo.lock', 'global.json', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-pr-managed-
      - name: Build fast solution
        run: dotnet build Koh.Fast.slnf --configuration Release -m:1
      - name: Run fast tests
        run: dotnet test --solution Koh.Fast.slnf --no-build --configuration Release --max-parallel-test-modules 1 -- --maximum-parallel-tests 1
